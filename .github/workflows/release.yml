name: Release

# Publishing a GitHub release whose tag is "v" + the version in pyproject.toml
# builds the package, checks it, installs and runs it, and uploads it to PyPI.
# Run it by hand (Actions > Release > Run workflow) to build and check without
# publishing anything.
#
# The upload uses PyPI's trusted publishing: PyPI accepts it because this
# workflow, in this repository and environment, is registered as the project's
# publisher. No token is stored anywhere.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      # A release tagged v1.4.0 must not publish a package that calls itself
      # something else, because PyPI never lets a version be replaced.
      - name: The release tag names this version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The release tag is $TAG, but pyproject.toml says $VERSION. Tag the release v$VERSION."
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel and run it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          test "$(/tmp/smoke/bin/ambermeta --version)" = "ambermeta $VERSION"
          /tmp/smoke/bin/ambermeta discover tests/data/amber/md_test_files > /dev/null
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert (r.files('ambermeta.gui') / 'static' / 'index.html').is_file(), 'the GUI bundle is missing from the wheel'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ambermeta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
