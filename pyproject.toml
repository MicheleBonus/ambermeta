[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambermeta"
version = "0.2.0"
description = "Simulation provenance extraction utilities for AMBER molecular dynamics runs."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "AmberMeta Contributors"}
]
keywords = [
    "amber",
    "molecular-dynamics",
    "simulation",
    "provenance",
    "metadata",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
netcdf = [
    "netCDF4>=1.6",
    "scipy>=1.8",
    "numpy>=1.23",
]
tui = [
    "textual>=0.40.0",
]
yaml = [
    "pyyaml>=6.0",
]
toml = [
    "tomli>=2.0; python_version < '3.11'",
]
tests = [
    "pytest>=7",
    "pytest-cov>=4.0",
]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
all = [
    "netCDF4>=1.6",
    "scipy>=1.8",
    "numpy>=1.23",
    "textual>=0.40.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
ambermeta = "ambermeta.cli:main"

[project.urls]
Homepage = "https://github.com/ambermeta/ambermeta"
Documentation = "https://github.com/ambermeta/ambermeta#readme"
Repository = "https://github.com/ambermeta/ambermeta.git"
Issues = "https://github.com/ambermeta/ambermeta/issues"

[tool.setuptools]
packages = ["ambermeta", "ambermeta.parsers", "ambermeta.legacy_extractors"]

[tool.setuptools.package-data]
ambermeta = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
